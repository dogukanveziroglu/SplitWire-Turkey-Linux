[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "splitwire-linux"
version = "1.0.0"
description = "Privacy-focused network routing tool for Linux"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "SplitWire-Turkey Contributors"}
]
keywords = ["vpn", "wireguard", "dpi", "network", "privacy", "routing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: System :: Networking",
]
dependencies = [
    "PyGObject>=3.42.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.8.0",
    "mypy>=1.0.0",
]

[project.scripts]
splitwire = "splitwire.__main__:main"
splitwire-cli = "splitwire.cli:main"

[project.gui-scripts]
splitwire-gtk = "splitwire.__main__:main"

[project.urls]
Homepage = "https://github.com/cagritaskn/SplitWire-Turkey"
Repository = "https://github.com/cagritaskn/SplitWire-Turkey"
Issues = "https://github.com/cagritaskn/SplitWire-Turkey/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
splitwire = [
    "resources/languages/*.json",
    "resources/zapret/*",
    "resources/icons/*",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "C4",
    "S", "SIM", "C90", "T20", "ERA", "FIX", "TD",
    "ARG", "RET", "PIE", "PL", "PERF", "RUF",
]

[tool.ruff.lint.per-file-ignores]
# GTK: gi.require_version() must precede gi.repository imports
"src/splitwire/application.py" = ["E402", "ARG002"]
"src/splitwire/ui/*.py" = ["E402", "ARG002"]
"src/splitwire/ui/**/*.py" = ["E402", "ARG002"]
# Entry point uses lazy imports for fast CLI response
"src/splitwire/__main__.py" = ["PLC0415", "E402"]
# System admin tool requires subprocess execution
"src/splitwire/core/shell.py" = ["S603", "S607"]
"src/splitwire/utils/polkit.py" = ["S603", "S607"]
"src/splitwire/services/*.py" = ["S603", "S607"]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.pylint]
max-args = 8
max-branches = 15
max-returns = 8
max-statements = 60

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v"
